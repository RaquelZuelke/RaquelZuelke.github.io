<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariah's Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card-front bg-front">
        <h1>Happy New Year!</h1>
        <a href="left.html" class="btn" id="openBtn">Open</a>

        <audio id="openAudio">
            <source src="audio/hoa.mp3" type="audio/mpeg">
        </audio>

        <script>
            const button = document.getElementById("openBtn");
            const audio = document.getElementById("openAudio");

            button.addEventListener("click", function(e) {
                e.preventDefault();
                audio.play();

                setTimeout(() => {
                    window.location.href = "left.html";
                }, 5000); // Delay navigation by 1 second to allow audio to play
            });
        </script>
    </div>
</body>
</html>
